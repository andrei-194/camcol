name: CI

# Verde obligatorio para fusionar. Hoy corre las pruebas de base de datos (PGlite).
# T-M0-04 (CAM-10) agrega lint, tipos y pruebas unitarias cuando exista apps/web.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:db
