name: CI

# Verde obligatorio para fusionar (T-M0-04). Corre las pruebas de base de datos (PGlite)
# y las comprobaciones de la app web: pruebas, tipos, lint y build.
# Pendiente: pruebas de integración con Supabase local (T-M1-10) y E2E (T-M2-09).

on:
  pull_request:
  push:
    branches: [main]

jobs:
  base-de-datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:db

  app-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
