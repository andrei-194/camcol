; Configuración de Odoo para entorno local.
; Los datos de conexión a Postgres llegan por variables de entorno (HOST, USER, PASSWORD).
; Producción usará su propio archivo con list_db=False, proxy_mode=True y workers=2 (ver ADR-0001).
[options]
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
workers = 0
list_db = True
proxy_mode = False
