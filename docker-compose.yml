# Entorno de desarrollo de la app web: Node 22 dentro de Docker, para no instalar nada en el PC.
# Los node_modules viven en volúmenes de Docker (en D:), no en la carpeta del proyecto.
#
#   npm run setup      instala las dependencias de apps/web dentro del contenedor
#   npm run dev        servidor de desarrollo en http://localhost:5173
#   npm test | typecheck | lint | build
#
# La base de datos local es aparte: Supabase CLI (npm run db:start), no este archivo.

services:
  dev:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - web_node_modules:/app/apps/web/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_POLL=1   # el montaje desde Windows no avisa de cambios de archivos
    command: npm --prefix apps/web run dev:docker

  # E2E (CAM-49): imagen oficial de Playwright (Chromium + WebKit ya instalados). Su versión debe coincidir con
  # `@playwright/test` de apps/web/package.json. Solo se usa con `npm run test:e2e` (perfil `e2e`).
  # Alcanza el Supabase local del PC por `host.docker.internal`.
  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    working_dir: /app/apps/web
    ipc: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - web_node_modules:/app/apps/web/node_modules
    environment:
      - E2E_SUPABASE_URL
      - E2E_ANON_KEY
      - E2E_SERVICE_KEY
      - E2E_EMAIL
      - E2E_PASSWORD
    command: npx playwright test

volumes:
  web_node_modules:
