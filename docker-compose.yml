name: camino

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - camino-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  odoo:
    build:
      context: .
      dockerfile: docker/odoo/Dockerfile
    image: camino-odoo:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    ports:
      - "127.0.0.1:${ODOO_PORT:-8069}:8069"
    volumes:
      - camino-odoo-data:/var/lib/odoo
      - ./src/addons:/mnt/extra-addons
      - ./src/config/odoo.conf:/etc/odoo/odoo.conf:ro
    restart: unless-stopped

  # Captura los correos que envía Odoo en local. Interfaz en http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  camino-db:
  camino-odoo-data:
