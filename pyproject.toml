[project]
name = "camino"
version = "0.1.0"
description = "Camino: vitrina virtual de productos campesinos sobre Odoo Community"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Odoo importa los submódulos en __init__.py para registrarlos.
"__init__.py" = ["F401"]
# El manifest de Odoo es un diccionario suelto por diseño.
"__manifest__.py" = ["B018"]
